name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sdlace-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: sdlace-linux-arm64
          - os: macos-latest
            artifact: sdlace-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libgtk-3-dev pkg-config cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sdl2 sdl2_ttf cmake

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Archive Linux Artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp build/src/sdlace ${{ matrix.artifact }}/
          cp ace.rom ${{ matrix.artifact }}/
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Archive macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: sdlace-macos
          path: build/*.dmg

      - name: Upload macOS Artifact for Release
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: sdlace-macos-release
          path: build/*.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/sdlace-linux-x86_64/sdlace-linux-x86_64.tar.gz
            artifacts/sdlace-linux-arm64/sdlace-linux-arm64.tar.gz
            artifacts/sdlace-macos-release/*.dmg
